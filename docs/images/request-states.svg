<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" color="#171B1F" viewBox="0 0 960 190" role="img" aria-label="Request states: a user frame creates a pending request; a turn_started carrying its marker makes it active; turn_ended forwards the answer and removes it; a turn_started without the marker leaves it pending; a codex queue failure removes it and notifies the sender.">
      <defs>
        <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
      </defs><rect x="0" y="0" width="960" height="190" fill="#FFFFFF"/>
      <g font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="currentColor">
        <g stroke="currentColor" stroke-width="1.4" fill="#FFFFFF">
          <rect x="40" y="60" width="180" height="50" rx="25"/>
          <rect x="390" y="60" width="180" height="50" rx="25"/>
          <rect x="740" y="60" width="180" height="50" rx="25"/>
        </g>
        <text x="130" y="90" text-anchor="middle" font-weight="600">pending</text>
        <text x="480" y="90" text-anchor="middle" font-weight="600">active</text>
        <text x="830" y="90" text-anchor="middle" font-weight="600">answered</text>
        <path d="M220 85 L390 85" stroke="currentColor" stroke-width="1.4" marker-end="url(#ra)" fill="none"/>
        <text x="305" y="76" text-anchor="middle" font-size="11">turn_started with marker</text>
        <path d="M570 85 L740 85" stroke="currentColor" stroke-width="1.4" marker-end="url(#ra)" fill="none"/>
        <text x="655" y="76" text-anchor="middle" font-size="11">turn_ended → forward</text>
        <path d="M0 85 L40 85" stroke="currentColor" stroke-width="1.4" marker-end="url(#ra)" fill="none"/>
        <text x="2" y="104" font-size="11">user frame</text>
        <path d="M130 110 C 130 150, 180 150, 200 150 L 200 150 C 230 150, 230 115, 200 110" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ra)"/>
        <text x="130" y="168" font-size="10.5" fill="#5F6A73">turn_started without marker → stays pending</text>
        <path d="M480 110 L480 168" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ra)"/>
        <text x="480" y="184" text-anchor="middle" font-size="10.5" fill="#B86E00">empty final message → "(Codex ended the turn without a final message.)"</text>
        <path d="M60 60 L60 30 L 150 30" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ra)"/>
        <text x="160" y="34" font-size="10.5" fill="#B86E00">codex queue fails → removed, sender told</text>
      </g>
    </svg>
