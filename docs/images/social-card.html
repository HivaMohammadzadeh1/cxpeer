<!doctype html><html><head><meta charset="utf-8"><title>card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Kalam:wght@700&display=swap">
<style>

.card{width:1280px;height:640px;position:relative;overflow:hidden;background:#F4F6F2}
.grid{position:absolute;inset:0;background-image:linear-gradient(#e6eae3 1px,transparent 1px),linear-gradient(90deg,#e6eae3 1px,transparent 1px);background-size:40px 40px;opacity:.7}
.logo{position:absolute;left:72px;top:64px;width:420px}

p{position:absolute;left:72px;top:400px;margin:0;font-size:26px;line-height:1.35;width:700px;color:#3a434b}
.hand{position:absolute;right:80px;top:92px;font-family:"Kalam",cursive;font-size:24px;color:#5F6A73;transform:rotate(-4deg)}
.loop{position:absolute;right:90px;top:150px;width:360px;height:300px}
.foot{position:absolute;left:72px;bottom:44px;font-family:"JetBrains Mono",monospace;font-size:20px;color:#5F6A73}
.pill{position:absolute;right:72px;bottom:44px;font-family:"JetBrains Mono",monospace;font-size:18px;color:#0B7A63;border:2px solid #0B7A63;border-radius:999px;padding:8px 16px}
</style></head><body><div class="card"><div class="grid"></div>
<img class="logo" src="cxpeer-logo-light.png" alt="">
<h1>Codex CLI sessions as Claude Code peers.</h1>
<p>Send a task from Claude Code, Codex does it in its own context, the answer comes back when the turn ends. No daemon, no polling.</p>
<div class="hand">8 s round trip, live TUI</div>
<svg class="loop" viewBox="0 0 360 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
