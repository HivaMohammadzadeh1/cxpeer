<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" color="#171B1F" viewBox="0 0 960 560" role="img" aria-label="Sequence: Claude sends auth and user frame to the bridge; bridge records the pending request and runs codex queue; the TUI picks the message up when idle; the UserPromptSubmit hook marks the turn started; the Stop hook delivers the last assistant message; the bridge forwards it back to the Claude socket.">
      <defs>
        <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
        <marker id="sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A43B5"/></marker>
        <marker id="sx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A63"/></marker>
        <marker id="sf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B86E00"/></marker>
      </defs><rect x="0" y="0" width="960" height="560" fill="#FFFFFF"/>
      <g font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="currentColor">
        <!-- lifeline heads -->
        <rect x="30" y="20" width="170" height="44" rx="3" fill="#E7E5F8" stroke="#4A43B5" stroke-width="1.5"/>
        <text x="115" y="39" text-anchor="middle" font-weight="600">unclave-8b</text>
        <text x="115" y="55" text-anchor="middle" font-size="10.5" fill="#5F6A73">Claude Code session</text>
        <rect x="265" y="20" width="170" height="44" rx="3" fill="#FFFFFF" stroke="currentColor" stroke-width="2"/>
        <text x="350" y="39" text-anchor="middle" font-weight="600">bridge codex-proj-ce</text>
        <text x="350" y="55" text-anchor="middle" font-size="10.5" fill="#5F6A73">/tmp/cc-socks/83599.sock</text>
        <rect x="500" y="20" width="170" height="44" rx="3" fill="#DDF2EC" stroke="#0B7A63" stroke-width="1.5"/>
        <text x="585" y="39" text-anchor="middle" font-weight="600">queue_1.sqlite</text>
        <text x="585" y="55" text-anchor="middle" font-size="10.5" fill="#5F6A73">written by codex queue</text>
        <rect x="750" y="20" width="180" height="44" rx="3" fill="#DDF2EC" stroke="#0B7A63" stroke-width="1.5"/>
        <text x="840" y="39" text-anchor="middle" font-weight="600">codex TUI + hooks</text>
        <text x="840" y="55" text-anchor="middle" font-size="10.5" fill="#5F6A73">thread 01a07d69…</text>
        <!-- lifelines -->
        <g stroke="currentColor" stroke-width="1" stroke-dasharray="3 5" opacity="0.6">
          <line x1="115" y1="64" x2="115" y2="540"/>
          <line x1="350" y1="64" x2="350" y2="540"/>
          <line x1="585" y1="64" x2="585" y2="540"/>
          <line x1="840" y1="64" x2="840" y2="540"/>
        </g>
        <!-- 1 -->
        <line x1="115" y1="105" x2="350" y2="105" stroke="#4A43B5" stroke-width="2" marker-end="url(#sc)"/>
        <text x="125" y="97" font-size="11" fill="#4A43B5">{"type":"auth","token":…}  then user frame, msg_id m1</text>
        <!-- 2 self note -->
        <rect x="358" y="128" width="200" height="30" rx="2" fill="#EDF0EA" stroke="currentColor" stroke-width="1"/>
        <text x="366" y="147" font-size="11">pending[m1] = uds:/tmp/cc-socks/81548.sock</text>
        <!-- 3 -->
        <line x1="350" y1="190" x2="585" y2="190" stroke="#0B7A63" stroke-width="2" marker-end="url(#sx)"/>
        <text x="360" y="182" font-size="11" fill="#0B7A63">codex queue --thread T --message "…[cxpeer msg_id=m1]"</text>
        <!-- 4 -->
        <line x1="585" y1="240" x2="840" y2="240" stroke="#0B7A63" stroke-width="1.5" marker-end="url(#sx)"/>
        <text x="595" y="232" font-size="11" fill="#0B7A63">TUI submits it when idle (~3 s)</text>
        <!-- 5 -->
        <line x1="840" y1="295" x2="350" y2="295" stroke="currentColor" stroke-width="1.5" marker-end="url(#sa)"/>
        <text x="360" y="287" font-size="11">UserPromptSubmit hook → cxpeer.turn_started m1 → status busy</text>
        <!-- 6 self note -->
        <rect x="760" y="318" width="160" height="30" rx="2" fill="#EDF0EA" stroke="#0B7A63" stroke-width="1"/>
        <text x="840" y="337" text-anchor="middle" font-size="11">Codex works the turn</text>
        <!-- 7 -->
        <line x1="840" y1="395" x2="350" y2="395" stroke="currentColor" stroke-width="1.5" marker-end="url(#sa)"/>
        <text x="360" y="387" font-size="11">Stop hook → cxpeer.turn_ended {last_assistant_message: "LOOP-OK"} → idle</text>
        <!-- 8 -->
        <line x1="350" y1="455" x2="115" y2="455" stroke="#B86E00" stroke-width="2" marker-end="url(#sf)"/>
        <text x="125" y="447" font-size="11" fill="#B86E00">auth (81548's token) + user frame from codex-proj-ce</text>
        <!-- 9 result -->
        <rect x="30" y="480" width="330" height="46" rx="2" fill="#E7E5F8" stroke="#4A43B5" stroke-width="1"/>
        <text x="40" y="499" font-size="11">&lt;cross-session-message from="uds:…/83599.sock"</text>
        <text x="40" y="515" font-size="11">  from-name="codex-proj-ce"&gt; LOOP-OK &lt;/…&gt;</text>
      </g>
    </svg>
